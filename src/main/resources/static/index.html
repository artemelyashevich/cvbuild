<!DOCTYPE html>
<html>
<head>
    <title>Spring AI Interview Stream</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        #response {
            margin-top: 20px;
            white-space: pre-wrap;
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 100px;
            background-color: #f9f9f9;
        }
        .status { color: gray; font-size: 0.8em; }
    </style>
</head>
<body>
    <div>
        <label>Chat ID: </label>
        <input type="text" id="chatId" value="user-123" />
    </div>
    <br/>
    <div>
        <input type="text" id="userInput" placeholder="Введите сообщение..." style="width: 300px;" />
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <div id="status" class="status">Connecting...</div>
    <div id="response"></div>

    <script>
        var stompClient = null;
        var currentSubscription = null;

        function connect() {
            var socket = new SockJS('/ws-chat');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);
                document.getElementById('status').innerText = "Connected to WebSocket";
                document.getElementById('sendBtn').disabled = false;

                // Сразу подписываемся на дефолтный ID
                subscribeToChat();
            }, function (error) {
                document.getElementById('status').innerText = "Error: " + error;
            });
        }

        function subscribeToChat() {
            var chatId = document.getElementById('chatId').value;

            // Если уже была подписка — отписываемся
            if (currentSubscription) {
                currentSubscription.unsubscribe();
            }

            console.log('Subscribing to /topic/chat/' + chatId);

            currentSubscription = stompClient.subscribe('/topic/chat/' + chatId, function (message) {
                showResponse(message.body);
            });
        }

        function sendMessage() {
            var chatId = document.getElementById('chatId').value;
            var content = document.getElementById('userInput').value;

            // Очищаем поле ответа перед новым запросом (опционально)
            // document.getElementById('response').innerHTML = "";

            // Формируем DTO как в Java (AiRequestDto)
            var aiRequestDto = {
                chatId: chatId,
                content: content
            };

            // Отправляем на @MessageMapping("/ai.interview")
            stompClient.send("/app/ai.interview", {}, JSON.stringify(aiRequestDto));

            // Очищаем ввод пользователя
            document.getElementById('userInput').value = "";
        }

        function showResponse(chunk) {
            var responseDiv = document.getElementById('response');
            if (chunk === "[DONE]") {
                responseDiv.innerHTML += "\n--- Конец сообщения ---\n";
            } else {
                // Добавляем кусочек текста
                responseDiv.innerHTML += chunk;
            }
            // Авто-скролл вниз
            responseDiv.scrollTop = responseDiv.scrollHeight;
        }

        // Переподписка при смене Chat ID вручную
        document.getElementById('chatId').addEventListener('change', subscribeToChat);

        // Инициализация
        connect();
    </script>
</body>
</html>
