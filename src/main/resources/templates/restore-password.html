<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">CVBUILD Notification</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f5; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:20px 10px;">
    <tr>
        <td align="center">

            <!-- Container -->
            <table width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:520px; background:#ffffff; border-radius:28px; padding:36px 24px; box-shadow:0 12px 30px rgba(0,0,0,0.06); text-align:center;">

                <!-- Header -->
                <tr>
                    <td>
                        <h1 style="margin:0; font-size:28px; font-weight:900; letter-spacing:-1px; color:#111;">
                            CVBUILD
                        </h1>
                        <p style="margin:6px 0 0; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#999;"
                           th:text="${subtitle}">
                            Notification
                        </p>
                    </td>
                </tr>

                <!-- Title -->
                <tr>
                    <td style="padding:30px 0 10px;">
                        <h2 style="margin:0; font-size:22px; font-weight:800; color:#111;"
                            th:text="${heading}">
                            Заголовок письма
                        </h2>
                    </td>
                </tr>

                <!-- Text -->
                <tr>
                    <td style="padding:10px 0 20px;">
                        <p style="margin:0; font-size:15px; color:#555; line-height:1.6;"
                           th:text="${text}">
                            Основной текст сообщения
                        </p>
                    </td>
                </tr>

                <!-- Highlight Block (optional: код / важное сообщение) -->
                <tr th:if="${highlight != null}">
                    <td style="padding:20px 0;">
                        <div style="
                            display:inline-block;
                            padding:16px 28px;
                            font-size:28px;
                            font-weight:900;
                            letter-spacing:4px;
                            background:#D6FF00;
                            color:#000;
                            border-radius:18px;
                            box-shadow:0 10px 25px rgba(214,255,0,0.35);
                        ">
                            <span th:text="${highlight}"></span>
                        </div>
                    </td>
                </tr>

                <!-- CTA Button (optional) -->
                <tr th:if="${buttonText != null}">
                    <td style="padding:20px 0;">
                        <a th:href="${buttonLink}"
                           style="
                                display:inline-block;
                                padding:16px 36px;
                                background:#111;
                                color:#fff !important;
                                text-decoration:none;
                                border-radius:999px;
                                font-weight:900;
                                font-size:13px;
                                letter-spacing:1px;
                                text-transform:uppercase;
                                box-shadow:0 6px 15px rgba(0,0,0,0.2);
                           "
                           th:text="${buttonText}">
                            Открыть
                        </a>
                    </td>
                </tr>

                <!-- Hint -->
                <tr th:if="${hint != null}">
                    <td style="padding-top:10px;">
                        <p style="font-size:12px; color:#888;" th:text="${hint}">
                            Дополнительная информация
                        </p>
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:25px 0;">
                        <div style="height:1px; background:#eee;"></div>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td>
                        <p style="margin:0; font-size:11px; color:#bbb; letter-spacing:1px;">
                            © CVBUILD — AI Resume Builder
                        </p>
                        <p style="margin:6px 0 0; font-size:11px; color:#ccc;"
                           th:text="${footer}">
                            Если это были не вы — проигнорируйте письмо
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
