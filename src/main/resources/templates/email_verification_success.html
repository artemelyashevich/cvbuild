<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verified</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 20px;
        }

        h1 {
            color: #007bff;
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
            font-size: 16px;
        }

        .button-container {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #007bff;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">✔</div>
    <h1>Account Verified!</h1>
    <p>Congratulations, <strong th:text="${login}">User</strong>!</p>
    <p>Your email has been successfully verified. Your account is now fully active and you can start building your
        professional CV right away.</p>

    <div class="button-container">
        <a href="http://localhost:3000/login" class="btn">Start Building CV</a>
    </div>

    <p class="footer">
        If you didn't create this account, please ignore this email.
    </p>
</div>
</body>
</html>
