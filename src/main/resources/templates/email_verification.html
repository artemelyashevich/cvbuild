<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CVBUILD Notification</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:20px 10px;">
    <tr>
        <td align="center">

            <table width="100%" max-width="520" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; border-radius:24px; padding:32px 24px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">

                <tr>
                    <td align="center" style="padding-bottom:20px;">
                        <h1 style="margin:0; font-size:28px; font-weight:900; letter-spacing:-1px; color:#111;">
                            CVBUILD
                        </h1>
                        <p style="margin:8px 0 0; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#888;">
                            Email Verification
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:10px 0 20px;">
                        <h2 style="margin:0; font-size:22px; font-weight:800; color:#111;">
                            Подтвердите ваш email
                        </h2>
                        <p style="margin:10px 0 0; font-size:14px; color:#666; line-height:1.5;">
                            Введите код ниже, чтобы продолжить создание идеального резюме.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:20px 0;">
                        <div style="
                            display:inline-block;
                            padding:18px 28px;
                            font-size:32px;
                            font-weight:900;
                            letter-spacing:6px;
                            background:#D6FF00;
                            color:#000;
                            border-radius:16px;
                            box-shadow:0 8px 20px rgba(214,255,0,0.3);
                        ">
                            <span th:text="${otp}"></span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding-top:10px;">
                        <p style="font-size:12px; color:#999; line-height:1.6;">
                            Код действителен в течение нескольких минут.<br/>
                            Если вы не запрашивали его — просто проигнорируйте письмо.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 0;">
                        <div style="height:1px; background:#eee;"></div>
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <p style="margin:0; font-size:11px; color:#bbb; letter-spacing:1px;">
                            © CVBUILD — AI Resume Builder
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
